[package]
name = "env-manager"
version = "0.1.0"
description = "Local-first, GUI-only env manager (Tauri v2 shell)"
edition = "2021"

# P1 will add: rusqlite (bundled, local vault), keyring (OS keychain),
# notify (file watcher). P0 keeps the shell minimal.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# P1 local vault (SQLite) + OS keychain (P2 unlocked-key hold).
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
keyring = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
