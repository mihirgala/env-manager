[package]
name = "env-manager"
version = "0.1.0"
description = "Local-first, GUI-only env manager (Tauri v2 shell)"
edition = "2021"

# Rust stays thin: FS, git remote lookup, SQLite rows, dialogs. No crypto,
# dotenv parsing, or sync logic here.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Local vault (SQLite) — opaque rows only.
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
