name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            rpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build and draft release (tag push)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned 0.1.0. Do not pass empty APPLE_* values here:
          # Tauri sees the variable as set and tries to import an empty certificate.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'env-manager ${{ github.ref_name }}'
          releaseBody: |
            Unsigned build. `.env` files stay the source of truth; no account or server.

            - Windows: SmartScreen -> More info -> Run anyway.
            - macOS: right-click the app -> Open (or allow it in Privacy & Security).
            - Linux: chmod +x env-manager_*.AppImage && ./env-manager_*.AppImage

            Attach `SHA256SUMS.txt` before publishing. See `docs/DISTRIBUTION.md` for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build artifacts (manual run)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-manager-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
